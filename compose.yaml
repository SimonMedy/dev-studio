services:
  certs-init:
    image: alpine:3.22
    container_name: dev-docker-init
    restart: "no"

    command:
      - sh
      - -c
      - |
        mkdir -p /certs /docker-data
        chown -R 1000:1000 /certs /docker-data
        chmod 700 /certs /docker-data

    volumes:
      - dev-docker-certs:/certs
      - dev-docker-data:/docker-data

  dev-docker:
    image: docker:29-dind-rootless
    container_name: dev-docker
    restart: unless-stopped
    privileged: true
    # Ports publiés des conteneurs internes → directement sur l'hôte
    network_mode: host

    depends_on:
      certs-init:
        condition: service_completed_successfully

    environment:
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_TLS_SAN: DNS:dev-docker
      TINI_SUBREAPER: "1"

    volumes:
      # Données persistantes du Docker de développement
      - dev-docker-data:/home/rootless/.local/share/docker

      # Certificats TLS générés par DinD
      - dev-docker-certs:/certs

      # Même chemin dans les deux services pour les bind mounts
      - "${HOST_WORKSPACE_PATH:?HOST_WORKSPACE_PATH doit être défini}:/config/workspace"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "DOCKER_HOST=unix:///run/user/1000/docker.sock docker info >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: yxtomix-dev-studio:latest
    container_name: dev-studio
    restart: unless-stopped

    depends_on:
      dev-docker:
        condition: service_healthy

    # Le démon n'a plus d'IP sur le réseau compose (mode host) :
    # on le joint via l'IP du bridge hôte (gateway dev_default)
    extra_hosts:
      - "dev-docker:172.20.0.1"

    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Paris
      DEFAULT_WORKSPACE: /config/workspace

      PASSWORD: ${CODE_SERVER_PASSWORD:?CODE_SERVER_PASSWORD doit être défini}
      SUDO_PASSWORD: ${SUDO_PASSWORD:-}

      # Connexion TLS au Docker de développement
      DOCKER_HOST: tcp://dev-docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client

      ENABLE_OPENCODE_SERVER: ${ENABLE_OPENCODE_SERVER:-false}

    volumes:
      - "${HOST_CONFIG_PATH:?HOST_CONFIG_PATH doit être défini}:/config"
      - "${HOST_WORKSPACE_PATH:?HOST_WORKSPACE_PATH doit être défini}:/config/workspace"

      # Le client Docker lit uniquement ses certificats
      - dev-docker-certs:/certs:ro

      - "./root/custom-services.d:/custom-services.d:ro"

    ports:
      - "8443:8443"
      - "4096:4096"

volumes:
  dev-docker-data:  
  dev-docker-certs: